name: package
on:
  push:
    tags:        
      - "*"
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - name: 01 Checkout Code
      uses: actions/checkout@v4
    - name: 02 Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: | 
          6.0.x
          9.0.x
    - name: 03 Restore Dotnet Tool
      run: dotnet tool restore
    - name: 04 Check Code Format
      run: dotnet format --verify-no-changes 
    - name: 05 Build with dotnet
      run: dotnet build
    - name: 06 Setup docker compose
      uses: KengoTODA/actions-setup-docker-compose@v1
      with:
        version: '2.14.2' # the full version of `docker-compose` command
    - name: 07 Count Test Projects
      run: echo TEST_PROJ_COUNT=$(ls -l test |grep "^d"|wc -l) >> $GITHUB_ENV
    - name: 08 Run Unit test
      if: env.TEST_PROJ_COUNT>0
      run: dotnet test --no-restore /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:Exclude="[*Test]*"
    - name: 09 Set Git Tag Name
      run: echo GIT_TAG=${GITHUB_REF:10} >> $GITHUB_ENV
    - name: 10 Set Pack Version
      run: echo PACK_VERSION=${GIT_TAG#v} >> $GITHUB_ENV
    - name: 11 Create Package
      run: dotnet pack -p:PackageVersion=${PACK_VERSION} -p:RepositoryUrl=${{github.event.repository.url}} -p:PackageProjectUrl=${{github.event.repository.url}} -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg -o .publish --configuration Release
    - name: 12 Get OIDC Token
      id: idtoken
      uses: actions/github-script@v7
      with:
        script: |
          const token = await core.getIDToken();
          core.setOutput('value', token);
    - name: 12.5 Debug OIDC Claims
      env:
        OIDC_TOKEN: ${{ steps.idtoken.outputs.value }}
      run: |
        echo "Token length: ${#OIDC_TOKEN}"
        if [ -z "$OIDC_TOKEN" ]; then
          echo "ERROR: OIDC token is empty!"
          exit 1
        fi
        PAYLOAD=$(echo "$OIDC_TOKEN" | cut -d'.' -f2)
        REMAINDER=$(( ${#PAYLOAD} % 4 ))
        if [ $REMAINDER -ne 0 ]; then
          PAYLOAD="${PAYLOAD}$(printf '=%.0s' $(seq 1 $((4 - REMAINDER))))"
        fi
        echo "=== JWT Claims (sent to NuGet) ==="
        echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '.'
        echo "=== End Claims ==="
    - name: 13 Push Package
      env:
        NUGET_APIKEY: ${{ steps.idtoken.outputs.value }}
      run: bash ./.github/scripts/pushpack.sh .publish "$NUGET_APIKEY"