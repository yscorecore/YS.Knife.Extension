name: package
on:
  push:
    tags:
      - "*"

jobs:
  format:
    name: dotnet format check
    runs-on: ubuntu-latest
    steps:
    - name: 01 Checkout Code
      uses: actions/checkout@v4

    - name: 02 Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: 03 Tool cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/dotnet-format
        key: ${{ runner.os }}-dotnet-format-${{ hashFiles('.config/dotnet-tools.json') }}
        restore-keys: |
          ${{ runner.os }}-dotnet-format-

    - name: 04 Restore Dotnet Tool
      run: dotnet tool restore

    - name: 05 Check Code Format
      run: dotnet format --verify-no-changes -v q

  test:
    name: test (${{ matrix.os }} / ${{ matrix.target }})
    needs: format
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        target: [net6.0, net8.0, net9.0, net10.0]

    steps:
    - name: 01 Checkout Code
      uses: actions/checkout@v4

    - name: 02 Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.0.x

    - name: 03 Build all TF outputs
      run: dotnet build --configuration Release

    - name: 04 Setup docker compose
      uses: KengoTODA/actions-setup-docker-compose@v1
      with:
        version: '2.14.2'

    - name: 05 Run tests for ${{ matrix.target }}
      run: dotnet test --no-build --no-restore -f ${{ matrix.target }}
        --configuration Release
        /p:CollectCoverage=true
        /p:CoverletOutputFormat=cobertura
        /p:CoverletOutput=coverage_${{ matrix.target }}_${{ matrix.os }}

  package:
    name: pack all TF & push NuGet
    needs: [format, test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - name: 01 Checkout Code
      uses: actions/checkout@v4

    - name: 02 Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: 03 Set Git Tag Name
      run: echo GIT_TAG=${GITHUB_REF:10} >> $GITHUB_ENV

    - name: 04 Set Pack Version
      run: echo PACK_VERSION=${GIT_TAG#v} >> $GITHUB_ENV

    - name: 05 Create multi-TF Packages
      run: dotnet pack
        -p:PackageVersion=${PACK_VERSION}
        -p:RepositoryUrl=${{ github.event.repository.url }}
        -p:PackageProjectUrl=${{ github.event.repository.url }}
        -p:IncludeSymbols=true
        -p:SymbolPackageFormat=snupkg
        --configuration Release
        -o .publish

    - name: 06 NuGet Login (OIDC -> temp API key)
      uses: NuGet/login@v1
      id: nugetlogin
      with:
        user: ypb

    - name: 07 Push Package
      env:
        NUGET_APIKEY: ${{ steps.nugetlogin.outputs.NUGET_API_KEY }}
      run: bash ./.github/scripts/pushpack.sh .publish "$NUGET_APIKEY"
