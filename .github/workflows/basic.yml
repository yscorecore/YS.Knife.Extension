name: basic
on:
  push:
    branches:
      - "*"
      - "!master"
    tags-ignore:
      - "*"

jobs:
  build:
    name: basic build
    runs-on: ubuntu-latest

    steps:
    - name: 01 Checkout Code
      uses: actions/checkout@v4

    - name: 02 Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          6.0.x
          8.0.x
          9.0.x
          10.0.x

    - name: 03 Build all TF outputs
      run: dotnet build --configuration Release
